<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#E7EBF3;font-family:Archivo,system-ui,sans-serif}a{color:#0B3C8C}a:hover{color:#0B3C8C}input,button{font-family:Archivo,system-ui,sans-serif}input:focus{outline:none}</style></helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box;background:#E7EBF3">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="402px,874px" width="{{ dw }}" height="{{ dh }}">
  <div style="height:100%;display:flex;flex-direction:column;background:#F4F6FB">

    <div style="background:#0B3C8C;padding:60px 20px 16px;color:#fff;flex:none">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div style="font:800 21px/1.1 Archivo;letter-spacing:-.3px">{{ titulo }}</div>
          <div style="font:500 12.5px/1.4 Archivo;color:rgba(255,255,255,.62);margin-top:3px">Cadastro de presença</div>
        </div>
        <div style="text-align:right">
          <div style="font:600 30px/1 'IBM Plex Mono',monospace;color:#FFD21E">{{ total }}</div>
          <div style="font:500 10px/1.4 Archivo;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.5)">cadastrados</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:14px;padding:7px 11px;background:rgba(255,255,255,.09);border-radius:9px">
        <div style="width:7px;height:7px;border-radius:9px;background:#FFD21E"></div>
        <div style="font:500 11.5px/1.3 Archivo;color:rgba(255,255,255,.8)">Offline — {{ pend }} aguardando envio</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:14px;padding:4px;background:rgba(0,0,0,.22);border-radius:12px">
        <button onClick="{{ goForm }}" style="flex:1;height:40px;border:none;border-radius:9px;background:{{ tabFormBg }};color:{{ tabFormFg }};font:700 14px Archivo">Cadastrar</button>
        <button onClick="{{ goList }}" style="flex:1;height:40px;border:none;border-radius:9px;background:{{ tabListBg }};color:{{ tabListFg }};font:700 14px Archivo">Lista</button>
      </div>
    </div>

    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;min-height:0;display:flex;flex-direction:column">
        <div style="flex:1;overflow:auto;padding:20px 20px 22px;display:flex;flex-direction:column;gap:18px">
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font:600 11px/1 Archivo;letter-spacing:.7px;text-transform:uppercase;color:#6B7488">Nome completo</label>
            <input value="{{ nome }}" onChange="{{ setNome }}" placeholder="Maria da Silva" autoComplete="off" style="width:100%;box-sizing:border-box;height:56px;padding:0 16px;border:1.5px solid #CFD8E8;border-radius:13px;background:#fff;font-size:19px;font-weight:500;color:#131A2B" style-focus="border-color:#0B3C8C;box-shadow:0 0 0 3px rgba(11,60,140,.14)">
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font:600 11px/1 Archivo;letter-spacing:.7px;text-transform:uppercase;color:#6B7488">Telefone / WhatsApp</label>
            <input value="{{ tel }}" onChange="{{ setTel }}" inputMode="tel" placeholder="(22) 90000-0000" style="width:100%;box-sizing:border-box;height:56px;padding:0 16px;border:1.5px solid #CFD8E8;border-radius:13px;background:#fff;font-size:19px;font-weight:500;font-family:'IBM Plex Mono',monospace;color:#131A2B" style-focus="border-color:#0B3C8C;box-shadow:0 0 0 3px rgba(11,60,140,.14)">
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font:600 11px/1 Archivo;letter-spacing:.7px;text-transform:uppercase;color:#6B7488">Bairro</label>
            <input value="{{ bairro }}" onChange="{{ setBairro }}" placeholder="Digite o bairro" autoComplete="off" style="width:100%;box-sizing:border-box;height:56px;padding:0 16px;border:1.5px solid #CFD8E8;border-radius:13px;background:#fff;font-size:19px;font-weight:500;color:#131A2B" style-focus="border-color:#0B3C8C;box-shadow:0 0 0 3px rgba(11,60,140,.14)">
            <sc-if value="{{ temSugestoes }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:7px;flex-wrap:wrap">
                <sc-for list="{{ sugBairros }}" as="b" hint-placeholder-count="3">
                  <button onClick="{{ b.pick }}" style="min-height:36px;padding:0 12px;border-radius:10px;border:1px dashed #BCC6DA;background:transparent;color:#4A5468;font:500 13.5px Archivo">{{ b.name }}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <label style="font:600 11px/1 Archivo;letter-spacing:.7px;text-transform:uppercase;color:#6B7488">Quem indicou</label>
            <input value="{{ ind }}" onChange="{{ setInd }}" placeholder="Nome da liderança" autoComplete="off" style="width:100%;box-sizing:border-box;height:56px;padding:0 16px;border:1.5px solid #CFD8E8;border-radius:13px;background:#fff;font-size:19px;font-weight:500;color:#131A2B" style-focus="border-color:#0B3C8C;box-shadow:0 0 0 3px rgba(11,60,140,.14)">
            <sc-if value="{{ mostrarRecentes }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:7px;flex-wrap:wrap">
                <sc-for list="{{ sugInd }}" as="r" hint-placeholder-count="3">
                  <button onClick="{{ r.pick }}" style="min-height:36px;padding:0 12px;border-radius:10px;border:1px dashed #BCC6DA;background:transparent;color:#4A5468;font:500 13.5px Archivo">{{ r.name }}</button>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </div>
        <div style="flex:none;padding:10px 20px 34px;background:#F4F6FB;display:flex;flex-direction:column;gap:8px">
          <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
            <div style="padding:9px 13px;border-radius:10px;background:#0B3C8C;color:#fff;font:600 13px Archivo">{{ toast }}</div>
          </sc-if>
          <button onClick="{{ save }}" style="height:60px;border:none;border-radius:15px;background:#0B3C8C;color:#fff;font:700 18px Archivo;letter-spacing:.2px" style-active="background:#082C68">Salvar e próximo</button>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;min-height:0;display:flex;flex-direction:column">
        <div style="flex:none;padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px">
          <input value="{{ busca }}" onChange="{{ setBusca }}" placeholder="Buscar nome, bairro ou indicação" autoComplete="off" style="width:100%;box-sizing:border-box;height:48px;padding:0 15px;border:1.5px solid #CFD8E8;border-radius:12px;background:#fff;font-size:15.5px;font-weight:500;color:#131A2B" style-focus="border-color:#0B3C8C">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
            <div style="font:600 11px/1 Archivo;letter-spacing:.8px;text-transform:uppercase;color:#7C859A">{{ resultLabel }}</div>
            <button onClick="{{ sync }}" style="height:32px;padding:0 12px;border:1px solid #CFD8E8;border-radius:9px;background:#fff;color:#4A5468;font:600 12.5px Archivo">{{ syncLabel }}</button>
          </div>
          <div style="display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid #CFD8E8;border-radius:12px;background:#fff">
            <div style="width:26px;height:26px;flex:none;border-radius:8px;background:#2FA36B;color:#fff;font:700 12px Archivo;display:flex;align-items:center;justify-content:center">GS</div>
            <div style="min-width:0;flex:1">
              <div style="font:600 12.5px/1.3 Archivo;color:#131A2B">Planilha do Google</div>
              <div style="font:500 11px/1.4 Archivo;color:#7C859A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ planilhaStatus }}</div>
            </div>
            <div style="width:7px;height:7px;flex:none;border-radius:9px;background:{{ planilhaDot }}"></div>
          </div>
        </div>
        <div style="flex:1;min-height:0;overflow:auto;padding:0 20px 40px;display:flex;flex-direction:column;gap:8px">
          <sc-for list="{{ lista }}" as="p" hint-placeholder-count="5">
            <div style="display:flex;align-items:center;gap:11px;padding:13px;background:#fff;border:1px solid #DCE3EF;border-radius:14px">
              <div style="width:38px;height:38px;flex:none;border-radius:12px;background:#E4EAF7;color:#0B3C8C;font:700 14px Archivo;display:flex;align-items:center;justify-content:center">{{ p.ini }}</div>
              <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:2px">
                <div style="font:600 15.5px/1.25 Archivo;color:#131A2B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.nome }}</div>
                <div style="font:500 12.5px/1.4 Archivo;color:#7C859A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ p.meta }}</div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none">
                <div style="font:600 12px 'IBM Plex Mono',monospace;color:#7C859A">{{ p.tel }}</div>
                <div style="display:flex;align-items:center;gap:5px">
                  <div style="width:7px;height:7px;border-radius:9px;background:{{ p.dot }}"></div>
                  <div style="font:600 10px/1 Archivo;letter-spacing:.5px;text-transform:uppercase;color:#939CB0">{{ p.status }}</div>
                </div>
              </div>
            </div>
          </sc-for>
          <sc-if value="{{ vazio }}" hint-placeholder-val="{{ false }}">
            <div style="padding:30px 16px;text-align:center;border:1.5px dashed #C6D0E2;border-radius:14px;font:500 13.5px/1.6 Archivo;color:#8892A6">{{ vazioTexto }}</div>
          </sc-if>
        </div>
      </div>
    </sc-if>

  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:466,&quot;height&quot;:938},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reunião Picciani&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mostrarRecentes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamento&quot;},&quot;jaCadastrados&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;min&quot;:0,&quot;max&quot;:500,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Comportamento&quot;}}">
const BAIRROS = ['Centro','Nova Esperança','Cidade Beira Mar','Extensão do Bosque','Âncora','Jardim Campomar','Rocha Leão','Zona Especial'];
const INDICADORES = ['Carlos Tavares','Dona Neide','Pastor Elias'];
const SEED = [
  { nome:'Rosângela Freitas', bairro:'Extensão do Bosque', tel:'(22) 99841-2207', ind:'Carlos Tavares', synced:true },
  { nome:'Joel Barbosa', bairro:'Âncora', tel:'(22) 99612-0044', ind:'Dona Neide', synced:true },
  { nome:'Vera Lúcia Pinto', bairro:'Centro', tel:'(22) 98870-3311', ind:'Pastor Elias', synced:true },
  { nome:'Anderson Muniz', bairro:'Nova Esperança', tel:'(22) 99205-7788', ind:'Carlos Tavares', synced:false },
];

function mask(v) {
  const d = (v || '').replace(/\D/g, '').slice(0, 11);
  if (d.length <= 2) return d.length ? '(' + d : '';
  if (d.length <= 7) return '(' + d.slice(0,2) + ') ' + d.slice(2);
  return '(' + d.slice(0,2) + ') ' + d.slice(2,7) + '-' + d.slice(7);
}
const first = (n) => (n || '').trim().split(/\s+/)[0] || '';
const norm = (s) => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const initials = (n) => (n || '').trim().split(/\s+/).slice(0,2).map(w => w[0] || '').join('').toUpperCase();

class Component extends DCLogic {
  state = { tab:'form', nome:'', tel:'', bairro:'', ind:'', busca:'', toast:'', list:SEED };

  set = (k) => (e) => this.setState({ [k]: e.target.value });

  save = () => {
    const { nome, tel, bairro, ind } = this.state;
    if (!nome.trim()) { this.setState({ toast:'Preencha o nome' }); return; }
    this.setState(s => ({
      list:[{ nome, bairro:bairro.trim(), tel, ind:ind.trim(), synced:false }, ...s.list],
      nome:'', tel:'', bairro:'', toast: first(nome) + ' salvo. Próximo!',
    }));
    clearTimeout(this._t); this._t = setTimeout(() => this.setState({ toast:'' }), 2200);
  };

  renderVals() {
    const s = this.state;
    const known = [...new Set([...s.list.map(p => p.bairro).filter(Boolean), ...BAIRROS])];
    const bq = norm(s.bairro);
    const sug = known.filter(b => norm(b).includes(bq) && norm(b) !== bq).slice(0, 3);
    const pend = s.list.filter(p => !p.synced).length;

    const q = norm(s.busca);
    const filtered = q
      ? s.list.filter(p => [p.nome, p.bairro, p.ind].some(v => norm(v).includes(q)))
      : s.list;

    return {
      dw: 402, dh: 874,
      titulo: this.props.titulo ?? 'Reunião Picciani',
      mostrarRecentes: this.props.mostrarRecentes ?? true,
      total: (this.props.jaCadastrados ?? 24) + (s.list.length - SEED.length),
      pend,

      isForm: s.tab === 'form', isList: s.tab === 'list',
      goForm: () => this.setState({ tab:'form' }),
      goList: () => this.setState({ tab:'list' }),
      tabFormBg: s.tab === 'form' ? '#F4F6FB' : 'transparent',
      tabFormFg: s.tab === 'form' ? '#0B3C8C' : 'rgba(255,255,255,.65)',
      tabListBg: s.tab === 'list' ? '#F4F6FB' : 'transparent',
      tabListFg: s.tab === 'list' ? '#0B3C8C' : 'rgba(255,255,255,.65)',

      nome: s.nome, tel: s.tel, bairro: s.bairro, ind: s.ind, toast: s.toast,
      setNome: this.set('nome'),
      setTel: (e) => this.setState({ tel: mask(e.target.value) }),
      setBairro: this.set('bairro'),
      setInd: this.set('ind'),
      save: this.save,
      temSugestoes: sug.length > 0,
      sugBairros: sug.map(name => ({ name, pick: () => this.setState({ bairro:name }) })),
      sugInd: [...new Set([...s.list.map(p => p.ind).filter(Boolean), ...INDICADORES])]
        .slice(0, 3).map(name => ({ name, pick: () => this.setState({ ind:name }) })),

      busca: s.busca, setBusca: this.set('busca'),
      resultLabel: q
        ? filtered.length + (filtered.length === 1 ? ' resultado' : ' resultados')
        : s.list.length + ' na lista de hoje',
      syncLabel: pend ? 'Sincronizar ' + pend : 'Tudo sincronizado',
      planilhaStatus: pend
        ? pend + (pend === 1 ? ' linha' : ' linhas') + ' na fila para enviar'
        : 'Todas as linhas enviadas · ' + s.list.length + ' na planilha',
      planilhaDot: pend ? '#FFD21E' : '#2FA36B',
      sync: () => this.setState(st => ({ list: st.list.map(p => ({ ...p, synced:true })) })),
      lista: filtered.map(p => ({
        nome: p.nome, ini: initials(p.nome), tel: p.tel || '—',
        meta: [p.bairro || 'sem bairro', p.ind ? 'ind. ' + first(p.ind) : 'sem indicação'].join(' · '),
        dot: p.synced ? '#2FA36B' : '#FFD21E',
        status: p.synced ? 'enviado' : 'offline',
      })),
      vazio: filtered.length === 0,
      vazioTexto: q ? 'Nenhum cadastro encontrado.' : 'Ninguém cadastrado ainda.',
    };
  }
}

</script>
</body>
</html>
